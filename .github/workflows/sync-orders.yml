name: Sync Shopify orders

on:
  schedule:
    # Every 6 hours — free on GitHub Actions (no Vercel Pro cron needed)
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger order sync on deployed app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skip: add APP_URL and CRON_SECRET in GitHub repo Settings → Secrets"
            exit 0
          fi
          curl -sf -X GET "${APP_URL%/}/api/cron/sync-orders" \
            -H "Authorization: Bearer ${CRON_SECRET}"
